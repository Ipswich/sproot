components:
  schemas:
    SuccessResponse:
      description: |
        A success response object that is returned by all successful API requests.  Contains a status code, timestamp, a unique request Id, and, optionally, some content.
      allOf:
        - type: object
          properties:
            statusCode:
              type: integer
            content:
              type: object
              required:
                - data
        - $ref: "#/components/schemas/ApiResponse"
    SDBJournal:
      description: |
        A journal object that is stored in the database. Contains all the information needed to  create a journal, including name, archival state, start date, and some optional details like description, icon, color, etc.
      type: object
      required:
        - title
        - archived
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        title:
          type: string
          example: My Journal
        description:
          nullable: true
          type: string
          example: Tracks care for my fern.
        icon:
          nullable: true
          type: string
          example: leaf
        color:
          nullable: true
          type: string
          example: "#00ff00"
        archived:
          type: boolean
          example: false
        createdAt:
          readOnly: true
          type: string
          format: date-time
          example: 2021-01-01T00:00:00.000Z
        editedAt:
          readOnly: true
          nullable: true
          type: string
          format: date-time
          example: 2021-06-01T12:00:00.000Z
        archivedAt:
          readOnly: true
          nullable: true
          type: string
          format: date-time
          example: 2021-12-31T23:59:59.000Z
    SDBJournalTag:
      description: |
        A journal tag object that is stored in the database. Contains all the information needed to  create a journal tag, including name and color of the tag.
      type: object
      required:
        - name
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        name:
          type: string
          example: "Shelf #1"
        color:
          nullable: true
          type: string
          example: "#0000ff"
    ErrorResponse:
      description: |
        An error response object that is returned by all unsuccessful API requests.  Contains a status code, timestamp, a unique request Id, and an error object. This error object may contain the name of the error, and an array of details (if relevant).
      allOf:
        - type: object
          required:
            - error
          properties:
            statusCode:
              type: integer
            error:
              type: object
              properties:
                request:
                  type: object
                  properties:
                    method:
                      type: string
                    url:
                      type: string
                    body:
                      type: object
                    query:
                      type: object
                name:
                  type: string
                url:
                  type: string
                details:
                  type: array
                  items:
                    type: string
        - $ref: "#/components/schemas/ApiResponse"
    JournalCreateRequest:
      description: |
        Request body for creating a journal.
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: My Journal
        description:
          nullable: true
          type: string
          example: Tracks care for my fern.
        icon:
          nullable: true
          type: string
          example: leaf
        color:
          nullable: true
          type: string
          example: "#00ff00"
    JournalUpdateRequest:
      description: |
        Request body for updating a journal. This operation changes only the fields provided.
      type: object
      properties:
        title:
          type: string
          example: My Journal
        description:
          nullable: true
          type: string
          example: Tracks care for my fern.
        icon:
          nullable: true
          type: string
          example: leaf
        color:
          nullable: true
          type: string
          example: "#00ff00"
        archived:
          type: boolean
          example: false
    SDBJournalEntryRead:
      allOf:
        - $ref: "#/components/schemas/SDBJournalEntry"
    SDBJournalEntryTag:
      description: |
        A journal entry tag object that is stored in the database. Contains all the information needed to  tag a journal entry, including the name and color of the tag.
      type: object
      required:
        - name
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        name:
          type: string
          example: Watering
        color:
          nullable: true
          type: string
          example: "#0000ff"
    SDBJournalEntryCreateRequest:
      description: |
        Request body for creating a journal entry. Contains only client-writable fields.
      type: object
      required:
        - content
      properties:
        title:
          nullable: true
          type: string
          example: Watered my fern
        content:
          type: string
          example: Gave my fern 500ml of water. The soil was pretty dry.
    SDBJournalEntryUpdateRequest:
      description: |
        Request body for updating a journal entry. Contains only client-writable fields.
      type: object
      properties:
        title:
          nullable: true
          type: string
          example: Watered my fern
        content:
          type: string
          example: Gave my fern 500ml of water. The soil was pretty dry.
    ApiResponse:
      description: |
        A generic response object that is returned by all API endpoints. Contains a status code,  timestamp, and a unique request Id.
      type: object
      required:
        - statusCode
        - timestamp
        - requestId
      properties:
        statusCode:
          type: integer
        timestamp:
          type: string
          example: 2021-01-01T00:00:00.000Z
        requestId:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    SDBJournalEntry:
      description: |
        A journal entry object that is stored in the database. Contains all the information needed to  create and represent a journal entry. The `content` property is required for write operations but may be omitted from responses when the server chooses not to include it (e.g. `withContent=false`).
      type: object
      required:
        - journalId
      properties:
        id:
          readOnly: true
          type: number
          example: 1
        journalId:
          readOnly: true
          type: number
          example: 1
        title:
          nullable: true
          type: string
          example: Watered my fern
        content:
          type: string
          example: Gave my fern 500ml of water. The soil was pretty dry.
        createdAt:
          readOnly: true
          type: string
          format: date-time
          example: 2021-01-01T00:00:00.000Z
        editedAt:
          readOnly: true
          nullable: true
          type: string
          format: date-time
          example: 2021-06-01T12:30:00.000Z
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt_token
