    Sproot is a general purpose environmental management system with a focus on greenhouse and garden. The system is intended to be used to monitor and control various environmental parameters, to  continuously update and maintain "homeostasis". This API is a machine-friendly interface for  interacting with the system, and is designed to be used by a web-based front-end. This specification can be used to generate client libraries, documentation, and other tools.
