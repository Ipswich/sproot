    DateRangeConditionEvaluation:
      description: |
        Serialized date range condition details used in automation evaluation payloads.
      type: object
      required:
        - kind
        - id
        - startMonth
        - startDate
        - endMonth
        - endDate
      properties:
        kind:
          type: string
          enum:
            - dateRange
        id:
          type: number
          example: 1
        startMonth:
          type: number
          example: 1
        startDate:
          type: number
          example: 1
        endMonth:
          type: number
          example: 12
        endDate:
          type: number
          example: 31
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt_token
