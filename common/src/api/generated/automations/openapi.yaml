  schemas:
    SuccessResponse:
      description: |
        A success response object that is returned by all successful API requests.  Contains a status code, timestamp, a unique request Id, and, optionally, some content.
      allOf:
        - type: object
          properties:
            statusCode:
              type: integer
            content:
              type: object
              required:
                - data
        - $ref: "#/components/schemas/ApiResponse"
    Automation:
      description: |
        A generic automation object stored in the database. This is the base object that all automations are built from. Contains a just a name and an ID.
      type: object
      properties:
        id:
          readOnly: true
          type: number
          example: 1
        name:
          type: string
          example: Turn on light
        operator:
          type: string
          example: or
        enabled:
          type: boolean
          example: true
    ErrorResponse:
      description: |
        An error response object that is returned by all unsuccessful API requests.  Contains a status code, timestamp, a unique request Id, and an error object. This error object may contain the name of the error, and an array of details (if relevant).
      allOf:
        - type: object
          required:
            - error
          properties:
            statusCode:
              type: integer
            error:
              type: object
              properties:
                request:
                  type: object
                  properties:
                    method:
                      type: string
                    url:
                      type: string
                    body:
                      type: object
                    query:
                      type: object
                name:
                  type: string
                url:
                  type: string
                details:
                  type: array
                  items:
                    type: string
        - $ref: "#/components/schemas/ApiResponse"
    AutomationCreateRequest:
      description: |
        Request body for creating an automation.
      type: object
      required:
        - name
        - operator
      properties:
        name:
          type: string
          example: Turn on light
        operator:
          type: string
          enum:
            - and
            - or
          example: or
    AutomationUpdateRequest:
      description: |
        Request body for updating an automation. This operation changes only the fields provided.
      type: object
      properties:
        name:
          type: string
          example: Turn on light
        operator:
          type: string
          enum:
            - and
            - or
          example: or
        enabled:
          type: boolean
          example: true
    AutomationConditions:
      description: |
        These conditions define when an automation will run.
      type: object
      required:
        - sensor
        - output
        - time
        - weekday
        - month
        - dateRange
      properties:
        sensor:
          $ref: "#/components/schemas/SensorConditionGroup"
        output:
          $ref: "#/components/schemas/OutputConditionGroup"
        time:
          $ref: "#/components/schemas/TimeConditionGroup"
        weekday:
          $ref: "#/components/schemas/WeekdayConditionGroup"
        month:
          $ref: "#/components/schemas/MonthConditionGroup"
        dateRange:
          $ref: "#/components/schemas/DateRangeConditionGroup"
    SensorConditionGroup:
      description: |
        Sensor conditions grouped by boolean operator.
      type: object
      required:
        - allOf
        - anyOf
        - oneOf
      properties:
        allOf:
          type: array
          items:
            $ref: "#/components/schemas/SensorCondition"
        anyOf:
          type: array
          items:
            $ref: "#/components/schemas/SensorCondition"
        oneOf:
          type: array
          items:
            $ref: "#/components/schemas/SensorCondition"
    OutputConditionGroup:
      description: |
        Output conditions grouped by boolean operator.
      type: object
      required:
        - allOf
        - anyOf
        - oneOf
      properties:
        allOf:
          type: array
          items:
            $ref: "#/components/schemas/OutputCondition"
        anyOf:
          type: array
          items:
            $ref: "#/components/schemas/OutputCondition"
        oneOf:
          type: array
          items:
            $ref: "#/components/schemas/OutputCondition"
    TimeConditionGroup:
      description: |
        Time conditions grouped by boolean operator.
      type: object
      required:
        - allOf
        - anyOf
        - oneOf
      properties:
        allOf:
          type: array
          items:
            $ref: "#/components/schemas/TimeCondition"
        anyOf:
          type: array
          items:
            $ref: "#/components/schemas/TimeCondition"
        oneOf:
          type: array
          items:
            $ref: "#/components/schemas/TimeCondition"
    WeekdayConditionGroup:
      description: |
        Weekday conditions grouped by boolean operator.
      type: object
      required:
        - allOf
        - anyOf
        - oneOf
      properties:
        allOf:
          type: array
          items:
            $ref: "#/components/schemas/WeekdayCondition"
        anyOf:
          type: array
          items:
            $ref: "#/components/schemas/WeekdayCondition"
        oneOf:
          type: array
          items:
            $ref: "#/components/schemas/WeekdayCondition"
    MonthConditionGroup:
      description: |
        Month conditions grouped by boolean operator.
      type: object
      required:
        - allOf
        - anyOf
        - oneOf
      properties:
        allOf:
          type: array
          items:
            $ref: "#/components/schemas/MonthCondition"
        anyOf:
          type: array
          items:
            $ref: "#/components/schemas/MonthCondition"
        oneOf:
          type: array
          items:
            $ref: "#/components/schemas/MonthCondition"
    DateRangeConditionGroup:
      description: |
        Date range conditions grouped by boolean operator.
      type: object
      required:
        - allOf
        - anyOf
        - oneOf
      properties:
        allOf:
          type: array
          items:
            $ref: "#/components/schemas/DateRangeCondition"
        anyOf:
          type: array
          items:
            $ref: "#/components/schemas/DateRangeCondition"
        oneOf:
          type: array
          items:
            $ref: "#/components/schemas/DateRangeCondition"
    SensorConditionCreateRequest:
      description: |
        Request body for creating a sensor condition.
      type: object
      required:
        - groupType
        - operator
        - comparisonValue
        - sensorId
        - readingType
      properties:
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        operator:
          type: string
          example: greaterOrEqual
        comparisonValue:
          type: number
          example: 50
        comparisonLookback:
          nullable: true
          type: number
          example: 3
        sensorId:
          type: number
          example: 1
        readingType:
          type: string
          example: temperature
    OutputConditionCreateRequest:
      description: |
        Request body for creating an output condition.
      type: object
      required:
        - groupType
        - operator
        - comparisonValue
        - outputId
      properties:
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        operator:
          type: string
          example: greaterOrEqual
        comparisonValue:
          type: number
          example: 50
        comparisonLookback:
          nullable: true
          type: number
          example: 3
        outputId:
          type: number
          example: 1
    TimeConditionCreateRequest:
      description: |
        Request body for creating a time condition.
      type: object
      required:
        - groupType
      properties:
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        startTime:
          nullable: true
          type: string
          example: 12:00
        endTime:
          nullable: true
          type: string
          example: 18:00
    WeekdayConditionCreateRequest:
      description: |
        Request body for creating a weekday condition.
      type: object
      required:
        - groupType
        - weekdays
      properties:
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        weekdays:
          description: "A decimal conversion of a bitmask representing the days of the week: Sunday = 1, Monday = 2, Tuesday = 4, etc."
          type: number
          example: 127
    MonthConditionCreateRequest:
      description: |
        Request body for creating a month condition.
      type: object
      required:
        - groupType
        - months
      properties:
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        months:
          description: "A decimal conversion of a bitmask representing the months of the year: January = 1, February = 2, March = 4, etc."
          type: number
          example: 4095
    DateRangeConditionCreateRequest:
      description: |
        Request body for creating a date range condition.
      type: object
      required:
        - groupType
        - startMonth
        - startDate
        - endMonth
        - endDate
      properties:
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        startMonth:
          description: The month the date range starts on, as a number from 1 to 12.
          type: number
          example: 1
        startDate:
          description: The day the date range starts on, with the first day of the month as 1 and the last day as 28-31.
          type: number
          example: 1
        endMonth:
          description: The month the date range ends on, as a number from 1 to 12.
          type: number
          example: 12
        endDate:
          description: The day the date range ends on, with the first day of the month as 1 and the last day as 28-31.
          type: number
          example: 31
    SensorCondition:
      description: |
        Defines a condition based on a sensor value.
      type: object
      required:
        - id
        - groupType
        - operator
        - comparisonValue
        - sensorId
        - readingType
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        operator:
          type: string
          example: greaterOrEqual
        comparisonValue:
          type: number
          example: 50
        comparisonLookback:
          nullable: true
          type: number
          example: 3
        sensorId:
          type: number
          example: 1
        readingType:
          type: string
          example: temperature
    OutputCondition:
      description: |
        Defines a condition based on an output value.
      type: object
      required:
        - id
        - groupType
        - operator
        - comparisonValue
        - outputId
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        operator:
          type: string
          example: greaterOrEqual
        comparisonValue:
          type: number
          example: 50
        comparisonLookback:
          nullable: true
          type: number
          example: 3
        outputId:
          type: number
          example: 1
    TimeCondition:
      description: |
        Defines a condition based on time.
      type: object
      required:
        - id
        - groupType
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        startTime:
          nullable: true
          type: string
          example: 12:00
        endTime:
          nullable: true
          type: string
          example: 18:00
    WeekdayCondition:
      description: |
        Defines a condition based on the days of the week.
      type: object
      required:
        - id
        - groupType
        - weekdays
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        weekdays:
          description: "A decimal conversion of a bitmask representing the days of the week: Sunday = 1, Monday = 2, Tuesday = 4, etc."
          type: number
          example: 127
    MonthCondition:
      description: |
        Defines a condition based on the months of the year.
      type: object
      required:
        - id
        - groupType
        - months
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        months:
          description: "A decimal conversion of a bitmask representing the months of the year: January = 1, February = 2, March = 4, etc."
          type: number
          example: 4095
    DateRangeCondition:
      description: |
        Defines a condition for an interval of dates of the year.
      type: object
      required:
        - id
        - groupType
        - startMonth
        - startDate
        - endMonth
        - endDate
      properties:
        id:
          type: number
          readOnly: true
          example: 1
        groupType:
          type: string
          enum:
            - allOf
            - anyOf
            - oneOf
        startMonth:
          description: The month the date range starts on, as a number from 1 to 12.
          type: number
          example: 1
        startDate:
          description: The day the date range starts on, with the first day of the month as 1 and the last day as 28-31.
          type: number
          example: 1
        endMonth:
          description: The month the date range ends on, as a number from 1 to 12.
          type: number
          example: 12
        endDate:
          description: The day the date range ends on, with the first day of the month as 1 and the last day as 28-31.
          type: number
          example: 31
