    OutputAction:
      description: |
        An action object that is stored in the database. Contains the information needed to create an output action based on an existing automation.
      type: object
      required:
        - automationId
        - value
      properties:
        id:
          readOnly: true
          type: number
          example: 1
        automationId:
          type: number
          example: 1
        outputId:
          type: number
          example: 1
        value:
          type: number
          example: 50
    OutputActionCreateRequest:
      description: |
        Request body for creating an output action.
      type: object
      required:
        - automationId
        - outputId
        - value
      properties:
        automationId:
          type: number
          example: 1
        outputId:
          type: number
          example: 1
        value:
          type: number
          example: 50
    NotificationAction:
      description: |
        An action object that is stored in the database. Contains the information needed to send a notification when an automation triggers.
      type: object
      required:
        - automationId
        - subject
        - content
      properties:
        id:
          readOnly: true
          type: number
          example: 1
        automationId:
          type: number
          example: 1
        subject:
          type: string
          example: Test Notification
        content:
          type: string
          example: This is a test notification content.
    NotificationActionCreateRequest:
      description: |
        Request body for creating a notification action.
      type: object
      required:
        - automationId
        - subject
        - content
      properties:
        automationId:
          type: number
          example: 1
        subject:
          type: string
          example: Test Notification
        content:
          type: string
          example: This is a test notification content.
    ActiveNotifications:
      description: |
        Contains the active notification actions for triggered automations.
      type: object
      required:
        - lastRunAt
        - notifications
      properties:
        lastRunAt:
          description: Timestamp in milliseconds of when the automations were last evaluated.
          type: number
          example: 1713523200000
        notifications:
          description: List of active notification actions.
          type: array
          items:
            $ref: "#/components/schemas/ActiveNotification"
    ApiResponse:
      description: |
        A generic response object that is returned by all API endpoints. Contains a status code,  timestamp, and a unique request Id.
      type: object
      required:
        - statusCode
        - timestamp
        - requestId
      properties:
        statusCode:
          type: integer
        timestamp:
          type: string
          example: 2021-01-01T00:00:00.000Z
        requestId:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    ActiveNotification:
      description: |
        A notification action that is currently active due to its associated automation being triggered.
      type: object
      required:
        - notificationId
        - subject
        - content
        - payload
      properties:
        notificationId:
          description: The Id of the notification action.
          type: number
          example: 1
        subject:
          description: The notification subject.
          type: string
          example: Temperature Alert
        content:
          description: The notification content.
          type: string
          example: Temperature has exceeded threshold.
        payload:
          description: The automation event payload containing triggered automation details.
          $ref: "#/components/schemas/AutomationEventPayload"
    AutomationEventPayload:
      description: |
        Payload containing information about a triggered automation.
      type: object
      required:
        - automationId
        - automationName
        - operator
        - conditions
      properties:
        automationId:
          description: The Id of the automation.
          type: number
          example: 1
        automationName:
          description: The name of the automation.
          type: string
          example: Temperature Threshold
        operator:
          description: The logical operator for conditions (and/or).
          type: string
          enum:
            - and
            - or
          example: or
        conditions:
          description: The condition results for the automation.
          $ref: "#/components/schemas/AutomationConditionEvaluationSummary"
    AutomationConditionEvaluationSummary:
      description: |
        Summarized evaluation results for an automation, grouped by boolean operator.
      type: object
      required:
        - allOf
        - anyOf
        - oneOf
      properties:
        allOf:
          type: array
          items:
            $ref: "#/components/schemas/AutomationConditionEvaluationItem"
        anyOf:
          type: array
          items:
            $ref: "#/components/schemas/AutomationConditionEvaluationItem"
        oneOf:
          type: array
          items:
            $ref: "#/components/schemas/AutomationConditionEvaluationItem"
    AutomationConditionEvaluationItem:
      description: |
        The evaluation result for a single automation condition.
      type: object
      required:
        - condition
        - result
      properties:
        condition:
          anyOf:
            - $ref: "#/components/schemas/SensorConditionEvaluation"
            - $ref: "#/components/schemas/OutputConditionEvaluation"
            - $ref: "#/components/schemas/TimeConditionEvaluation"
            - $ref: "#/components/schemas/WeekdayConditionEvaluation"
            - $ref: "#/components/schemas/MonthConditionEvaluation"
            - $ref: "#/components/schemas/DateRangeConditionEvaluation"
        result:
          type: boolean
          example: true
    SensorConditionEvaluation:
      description: |
        Serialized sensor condition details used in automation evaluation payloads.
      type: object
      required:
        - kind
        - id
        - sensorId
        - readingType
        - operator
        - comparisonValue
        - comparisonLookback
      properties:
        kind:
          type: string
          enum:
            - sensor
        id:
          type: number
          example: 1
        sensorId:
          type: number
          example: 1
        readingType:
          type: string
          example: temperature
        operator:
          type: string
          example: greaterOrEqual
        comparisonValue:
          type: number
          example: 50
        comparisonLookback:
          nullable: true
          type: number
          example: 3
    OutputConditionEvaluation:
      description: |
        Serialized output condition details used in automation evaluation payloads.
      type: object
      required:
        - kind
        - id
        - outputId
        - operator
        - comparisonValue
        - comparisonLookback
      properties:
        kind:
          type: string
          enum:
            - output
        id:
          type: number
          example: 1
        outputId:
          type: number
          example: 1
        operator:
          type: string
          example: greaterOrEqual
        comparisonValue:
          type: number
          example: 50
        comparisonLookback:
          nullable: true
          type: number
          example: 3
    TimeConditionEvaluation:
      description: |
        Serialized time condition details used in automation evaluation payloads.
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum:
            - time
        id:
          type: number
          example: 1
        startTime:
          nullable: true
          type: string
          example: 12:00
        endTime:
