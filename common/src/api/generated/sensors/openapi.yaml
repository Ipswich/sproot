components:
  schemas:
    SuccessResponse:
      description: |
        A success response object that is returned by all successful API requests.  Contains a status code, timestamp, a unique request Id, and, optionally, some content.
      allOf:
        - type: object
          properties:
            statusCode:
              type: integer
            content:
              type: object
              required:
                - data
        - $ref: "#/components/schemas/ApiResponse"
    SensorBase:
      description: |
        A basic sensor object that is returned by the API. This expands upon SDBSensor, including the last reading, last reading time, and units. This maps to what the app keeps in memory.
      allOf:
        - $ref: "#/components/schemas/SDBSensor"
        - type: object
          required:
            - id
            - name
            - color
            - model
            - address
            - lastReading
            - lastReadingTime
            - units
          properties:
            id:
              type: number
              example: 1
            lastReading:
              type: object
              properties:
                temperature:
                  type: string
                  example: "23.5"
            lastReadingTime:
              type: string
              format: date-time
              nullable: true
              example: 2021-01-01T00:00:00.000Z
            units:
              type: object
              properties:
                temperature:
                  type: string
                  example: C
    ErrorResponse:
      description: |
        An error response object that is returned by all unsuccessful API requests.  Contains a status code, timestamp, a unique request Id, and an error object. This error object may contain the name of the error, and an array of details (if relevant).
      allOf:
        - type: object
          required:
            - error
          properties:
            statusCode:
              type: integer
            error:
              type: object
              properties:
                request:
                  type: object
                  properties:
                    method:
                      type: string
                    url:
                      type: string
                    body:
                      type: object
                    query:
                      type: object
                name:
                  type: string
                url:
                  type: string
                details:
                  type: array
                  items:
                    type: string
        - $ref: "#/components/schemas/ApiResponse"
    SensorCreateRequest:
      description: |
        Request body for creating a sensor. Contains only the fields consumed by the create sensor handler.
      type: object
      required:
        - name
        - model
        - address
      properties:
        name:
          type: string
          example: Windowsill
        model:
          type: string
          enum:
            - BME280
            - CAPACITIVE_MOISTURE_SENSOR
            - DS18B20
            - ADS1115
            - ESP32_BME280
            - ESP32_CAPACITIVE_MOISTURE_SENSOR
            - ESP32_DS18B20
            - ESP32_ADS1115
          example: DS18B20
        subcontrollerId:
          nullable: true
          type: number
          example: 1
        address:
          type: string
          example: 28-00000
        color:
          type: string
          example: "#ff0000"
        pin:
          nullable: true
          type: string
          example: "0"
    SensorCreateResponse:
      description: |
        Transport shape returned by create sensor. This reflects the handler response before any follow-up read normalization.
      type: object
      required:
        - name
        - model
        - address
      properties:
        name:
          type: string
          example: Windowsill
        model:
          type: string
          enum:
            - BME280
            - CAPACITIVE_MOISTURE_SENSOR
            - DS18B20
            - ADS1115
            - ESP32_BME280
            - ESP32_CAPACITIVE_MOISTURE_SENSOR
            - ESP32_DS18B20
            - ESP32_ADS1115
          example: DS18B20
        subcontrollerId:
          nullable: true
          type: number
          example: 1
        address:
          type: string
          example: 28-00000
        color:
          type: string
          example: "#ff0000"
        pin:
          nullable: true
          type: string
          example: "0"
    SensorUpdateRequest:
      description: |
        Request body for updating a sensor. This operation changes only the declared transport fields provided. Other writable fields still remain handler-owned until the runtime behavior is fully represented in the contract.
      type: object
      properties:
        name:
          type: string
          example: Windowsill
        model:
          type: string
          example: BME280
        address:
          type: string
          example: "0x76"
        color:
          type: string
          example: "#ff0000"
    SDBSensor:
      description: |
        A sensor object that is stored in the database. Contains all the information needed to  create a sensor, including name, model, address, and, color.
      type: object
      required:
        - name
        - model
        - address
        - color
      properties:
        name:
          type: string
          example: Windowsill
        model:
          type: string
          example: DS18B20
        subcontrollerId:
          nullable: true
          type: number
          example: 1
        address:
          type: string
          example: 28-00000
        color:
          type: string
          example: "#ff0000"
        pin:
          nullable: true
          type: string
          example: "0"
        lowCalibrationPoint:
          nullable: true
          type: number
          example: 0
        highCalibrationPoint:
          nullable: true
          type: number
          example: 100
    DataPoint:
      description: |
        A data point for recharts.
      allOf:
        - type: object
          required:
            - name
          properties:
            name:
              type: string
            units:
              type: string
        - type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
    ChartSeries:
      description: |
        An object containing both a name and a color. Used to add flair to a line on a chart.
      type: object
      required:
        - name
        - color
      properties:
        name:
          type: string
        color:
          type: string
    SupportedModels:
      description: |
        A Record of supported device models, mapped to a presentable label.
      type: object
      properties:
        type:
          type: string
    ReadingTypes:
      description: |
        An obejct of active sensor reading types and their units.
      type: object
    ApiResponse:
      description: |
        A generic response object that is returned by all API endpoints. Contains a status code,  timestamp, and a unique request Id.
      type: object
      required:
        - statusCode
        - timestamp
        - requestId
      properties:
        statusCode:
          type: integer
        timestamp:
          type: string
          example: 2021-01-01T00:00:00.000Z
        requestId:
          type: string
          example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt_token
