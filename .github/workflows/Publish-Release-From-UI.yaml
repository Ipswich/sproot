name: Publish Release From GitHub UI

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  DOCKER_BUILD_RECORD_UPLOAD: false
  NODE_VERSION: 24.13.1

jobs:
  verify-release:
    name: Verify release invariants
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.verify_release.outputs.version }}
      tag: ${{ steps.verify_release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag and image state
        id: verify_release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          PKG_VERSION=$(jq -r '.version' package.json)
          VERSION_TAG="v${PKG_VERSION}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${TAG}" != "${VERSION_TAG}" ]]; then
            echo "Tag (${TAG}) does not match package.json version ${VERSION_TAG}"
            exit 1
          fi

          git fetch origin main --tags
          SHA=$(git rev-parse "${TAG}^{commit}")

          if git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Tag points to a commit on main"
          else
            echo "Tag ${TAG} does not point to a commit contained in origin/main"
            exit 1
          fi

          for service in server client; do
            IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}-${service}:${PKG_VERSION}"

            if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "Container image already exists for ${IMAGE}"
              exit 1
            fi
          done

  build-and-push-images:
    needs: verify-release
    name: Build and Push Container Image
    env:
      VERSION: ${{ needs.verify-release.outputs.version }}
    strategy:
      matrix:
        include:
          - service: server
            dockerfile: ./server/Dockerfile
          - service: client
            dockerfile: ./gateway/Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}

      - name: Echo metadata
        run: |
          echo "tags: ${{ steps.meta.outputs.tags }}"
          echo "labels: ${{ steps.meta.outputs.labels }}"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./
          build-args: |
            VITE_VERSION=${{ env.VERSION }}
            VITE_API_SERVER_URL=
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true